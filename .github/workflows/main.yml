name: Build WebWindow APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir project
          unzip -q "$(ls *.zip | head -1)" -d project
          D=project
          if [ ! -f project/settings.gradle ]; then
            D=$(dirname "$(find project -name settings.gradle | head -1)")
          fi
          echo "PROJECT_DIR=$D" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept SDK licenses and install packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          LOG=$GITHUB_WORKSPACE/build.log
          cd "$PROJECT_DIR"
          gradle assembleDebug --console=plain > "$LOG" 2>&1 || {
            echo "===== PENYEBAB ERROR ====="
            grep -A25 "What went wrong" "$LOG" || tail -40 "$LOG"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: WebWindow-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
